version: '3.8'

services:
  app:
    image: student-management-app

    ports:
      - "3000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/student_management_db
      JWT_SECRET: supersecretjwtkeyforstudentmanagement123!
      NODE_ENV: production

    depends_on:
      - mongo

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mongo:
    image: mongo:6

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  mongo-data:
