version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-app
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/student_management_db
      - JWT_SECRET=supersecretjwtkeyforstudentmanagement123!
      - NODE_ENV=production
    restart: always
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: student-management-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
